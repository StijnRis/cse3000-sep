plugins {
    id 'java'
    id 'application'
    id 'jacoco'
}

version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

dependencies {
    implementation('org.xerial:sqlite-jdbc:3.53.0.0')

    testImplementation('org.junit.jupiter:junit-jupiter:5.14.3')
    testRuntimeOnly('org.junit.platform:junit-platform-launcher')
}

application {
    mainClass = 'RustScraper'
}

jacoco {
    toolVersion = "0.8.14"
}

test {
    useJUnitPlatform()

    dependsOn 'cleanTest'
    finalizedBy jacocoTestReport

    testLogging {
        events "passed", "skipped", "failed"
    }
}

jacocoTestReport {
    dependsOn test

    reports {
        xml.required = false
        csv.required = false
    }
}

